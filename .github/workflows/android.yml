name: Android checks

on:
  push:
    branches: [main, develop]
    paths: ['clients/android/**', 'clients/bridge/**', 'core/**']
  pull_request:
    paths: ['clients/android/**', 'clients/bridge/**', 'core/**']

jobs:
  detekt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/android
    steps:
      - uses: actions/checkout@v6

      # detekt 1.23.8 cannot run on JDK 25 (detekt#8714/#8980: it fails with
      # the bare JDK version string as the error). Keep it on JDK 24 until a
      # detekt release supports 25; the build job below already uses 25.
      - name: Set up JDK 24
        uses: actions/setup-java@v5
        with:
          java-version: '24'
          distribution: 'temurin'

      - name: Run detekt
        run: ./gradlew detekt --no-daemon

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/android
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Install protoc (needed by vault-core's prost build script)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install cargo-ndk
        uses: cargo-bins/cargo-binstall@3be4ad2b146f3302f92e5956c54fedbb6ae8cccc # v1.25.3
      - run: cargo binstall -y cargo-ndk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
