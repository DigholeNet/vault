name: Android checks

on:
  push:
    branches: [main, develop]
    paths:
      - 'clients/android/**'
      - 'clients/bridge/**'
      - 'core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'clients/android/**'
      - 'clients/bridge/**'
      - 'core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/android.yml'

jobs:
  detekt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/android
    steps:
      - uses: actions/checkout@v6

      # Keep detekt on JDK 24: this pin dates from the detekt 1.x era
      # (detekt 1.23.8 failed on newer JDKs with the bare JDK version string
      # as the error, detekt#8714/#8980). The project now uses detekt
      # 2.0.0-alpha.6, which officially supports running on JDK 25, but that
      # has not been verified in CI yet — drop this pin once confirmed; the
      # build job below already uses 25.
      - name: Set up JDK 24
        uses: actions/setup-java@v5
        with:
          java-version: '24'
          distribution: 'temurin'

      - name: Run detekt
        run: ./gradlew detekt --no-daemon

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/android
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Install protoc (needed by vault-core's prost build script)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install cargo-ndk
        uses: cargo-bins/cargo-binstall@3be4ad2b146f3302f92e5956c54fedbb6ae8cccc # v1.25.3
      - run: cargo binstall -y cargo-ndk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Run app unit tests and build debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon
