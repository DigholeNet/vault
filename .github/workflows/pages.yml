name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
      - 'scripts/update-site-release.py'
      - 'scripts/test-site-release.py'
  workflow_dispatch:
  release:
    types: [published, edited, deleted]
  workflow_run:
    workflows: [Release]
    types: [completed]
  schedule:
    # Reconcile later release or asset changes as a fallback.
    - cron: '23 2 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Release only publishes on tag pushes. Ignore failed runs and manual
    # artifact-only builds; read fresh release data instead of run artifacts.
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check release-link selection
        run: python -B scripts/test-site-release.py
      - name: Install QR generator
        run: python -m pip install qrcode==8.2
      - name: Refresh stable-release links and Android QR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update-site-release.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
