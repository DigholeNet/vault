name: Release

# One tag releases everything: Linux client (.deb) + Linux server (.deb) +
# Android client (signed APK) + notarized macOS app zip. The signed iOS IPA
# is built too, but is never uploaded (its Ad Hoc provisioning profile
# contains the team name and registered device UDIDs). Public workflow
# artifacts are downloadable by ordinary GitHub users. Apple packaging
# needs the signing secrets documented in docs/releasing.md.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_USE_ANDROIDX: true

jobs:
  version-gate:
    # Fail fast when the release tag disagrees with the workspace version
    # (root Cargo.toml [workspace.package]), the single version source.
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - uses: actions/checkout@v6

      - name: Verify tag matches workspace version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          MANIFEST_VERSION="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match workspace version $MANIFEST_VERSION" >&2
            exit 1
          fi

      - name: Export version for downstream jobs
        id: version
        run: |
          VERSION="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          # Same versionCode derivation as scripts/package-android.sh:
          # strip any pre-release suffix (e.g. 1.0.0-rc1 -> PATCH=0) so the
          # arithmetic never sees a non-numeric component.
          PATCH="${PATCH%%[!0-9]*}"
          for part in MAJOR MINOR PATCH; do
            if [[ ! "${!part}" =~ ^[0-9]+$ ]]; then
              echo "Invalid version component $part='${!part}' in version '$VERSION'" >&2
              exit 1
            fi
          done
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          # Pre-release versions (1.0.0-rc1) must sort below the final
          # release so an installed rc APK can upgrade to it.
          if [[ "$VERSION" == *-* && "$VERSION_CODE" -gt 1 ]]; then
            VERSION_CODE=$((VERSION_CODE - 1))
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

  linux-packages:
    needs: version-gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [edge, supernode]
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Install protoc, asciidoctor and cargo-deb
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler asciidoctor
          cargo install cargo-deb --locked

      - name: Cache cargo registry and target dir
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Build deb package
        run: cargo deb -p ${{ matrix.package }} --locked

      - name: Upload deb artifact
        uses: actions/upload-artifact@v6
        with:
          name: deb-${{ matrix.package }}
          path: target/debian/*.deb

  android-apk:
    needs: version-gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/android
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Cache cargo registry and target dir
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            clients/bridge/target
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-android-

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@3be4ad2b146f3302f92e5956c54fedbb6ae8cccc # v1.25.3

      - name: Install cargo-ndk
        run: cargo binstall -y cargo-ndk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install protoc (needed by vault-core's prost build script)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build signed release APK
        env:
          ANDROID_SIGNING_KEY_STORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_STORE_BASE64 }}
          ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
        # versionName/versionCode must come from the workspace version or
        # released APKs would all carry the build.gradle.kts defaults
        # (versionCode 1), making upgrade installs impossible.
        run: >-
          ./gradlew :app:assembleRelease --no-daemon
          -PversionName="${{ needs.version-gate.outputs.version }}"
          -PversionCode="${{ needs.version-gate.outputs.version_code }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: android-apk
          path: clients/android/app/build/outputs/apk/release/*.apk

      - name: Remove decoded keystore
        # The signing config decodes the base64 keystore into the build
        # directory; it must not linger on the runner disk, even when a step
        # above failed.
        if: always()
        run: rm -f app/build/signing/vault-release.keystore

  apple-packages:
    needs: version-gate
    runs-on: macos-latest
    steps:
      # Full history: scripts/package-apple.sh derives the build number from
      # the git commit count; a shallow clone would reset it to 1 and stall
      # system-extension upgrades (macOS only swaps a sysex whose bundle
      # version is strictly higher).
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios, x86_64-apple-darwin

      - name: Cache cargo registry and target dir
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            clients/bridge/target
          key: ${{ runner.os }}-cargo-apple-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-apple-

      - name: Install protoc (needed by vault-core's prost build script)
        run: brew install protobuf

      - name: Verify signing secrets
        # Fail fast with a readable message instead of a cryptic codesign
        # error twenty minutes into the build.
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APPLE_PROVISIONING_PROFILE_MACOS_APP_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_MACOS_APP_BASE64 }}
          APPLE_PROVISIONING_PROFILE_MACOS_SYSEX_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_MACOS_SYSEX_BASE64 }}
        run: |
          missing=()
          for var in APPLE_CERTIFICATE_P12_BASE64 APPLE_CERTIFICATE_PASSWORD \
              APPLE_TEAM_ID APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID \
              APP_STORE_CONNECT_PRIVATE_KEY APPLE_PROVISIONING_PROFILE_MACOS_APP_BASE64 \
              APPLE_PROVISIONING_PROFILE_MACOS_SYSEX_BASE64; do
            [[ -z "${!var}" ]] && missing+=("$var")
          done
          if ((${#missing[@]})); then
            printf 'Missing required GitHub secret: %s\n' "${missing[@]}" >&2
            echo "See docs/releasing.md > Apple signing in CI." >&2
            exit 1
          fi

      - name: Set up signing keychain and provisioning profiles
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APPLE_PROVISIONING_PROFILE_IOS_APP_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_IOS_APP_BASE64 }}
          APPLE_PROVISIONING_PROFILE_IOS_NE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_IOS_NE_BASE64 }}
          APPLE_PROVISIONING_PROFILE_MACOS_APP_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_MACOS_APP_BASE64 }}
          APPLE_PROVISIONING_PROFILE_MACOS_SYSEX_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_MACOS_SYSEX_BASE64 }}
        run: |
          set -euo pipefail

          # Ephemeral keychain with a random password; deleted in the cleanup
          # step below, so the distribution certificates never survive the job.
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" vault-ci.keychain
          security set-keychain-settings -lut 21600 vault-ci.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" vault-ci.keychain
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/vault-dist.p12"
          security import "$RUNNER_TEMP/vault-dist.p12" -k vault-ci.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          # Allow codesign to use the imported keys without a UI prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" vault-ci.keychain
          security list-keychains -d user -s vault-ci.keychain $(security list-keychains -d user | tr -d '"')
          # notarytool store-credentials writes to the default keychain.
          security default-keychain -d user -s vault-ci.keychain

          # Provisioning profiles must be installed under their UUID file
          # name. The two macOS Developer ID profiles are required (Manual
          # signing); the iOS ones are optional — Automatic signing fetches
          # them via -allowProvisioningUpdates when absent.
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          install_profile() {
            local label="$1" ext="$2" b64="$3"
            [[ -z "$b64" ]] && return 0
            printf '%s' "$b64" | base64 --decode > "$RUNNER_TEMP/$label.$ext"
            security cms -D -i "$RUNNER_TEMP/$label.$ext" > "$RUNNER_TEMP/$label.plist"
            local uuid
            uuid="$(plutil -extract UUID raw "$RUNNER_TEMP/$label.plist")"
            cp "$RUNNER_TEMP/$label.$ext" "$PROFILES_DIR/$uuid.$ext"
            # Record the installed path so the cleanup step can remove exactly
            # these profiles (they carry team name and, for Ad Hoc profiles,
            # registered device UDIDs).
            echo "$PROFILES_DIR/$uuid.$ext" >> "$RUNNER_TEMP/installed-profiles"
            echo "Installed provisioning profile $label ($uuid)"
          }
          install_profile ios-app mobileprovision "$APPLE_PROVISIONING_PROFILE_IOS_APP_BASE64"
          install_profile ios-network-extension mobileprovision "$APPLE_PROVISIONING_PROFILE_IOS_NE_BASE64"
          install_profile macos-app provisionprofile "$APPLE_PROVISIONING_PROFILE_MACOS_APP_BASE64"
          install_profile macos-system-extension provisionprofile "$APPLE_PROVISIONING_PROFILE_MACOS_SYSEX_BASE64"

          # App Store Connect API key: authenticates xcodebuild's
          # -allowProvisioningUpdates (no Xcode account on the runner) and
          # the notarytool keychain profile package-apple.sh notarizes with.
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          {
            echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
            echo "ASC_KEY_ID=$APP_STORE_CONNECT_KEY_ID"
            echo "ASC_KEY_ISSUER=$APP_STORE_CONNECT_ISSUER_ID"
          } >> "$GITHUB_ENV"
          xcrun notarytool store-credentials vault-notary \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --issuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Package iOS IPA and macOS app
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # xcodebuild prints the signing identity (the certificate common
        # name, i.e. the account holder's legal name on a personal team)
        # into the Actions log, which is world-readable on a public repo.
        run: |
          set -o pipefail
          scripts/package-apple.sh 2>&1 | grep -vE '(Signing Identity|Provisioning Profile):'
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: apple
          path: dist/Vault-macOS.zip
          if-no-files-found: error

      - name: Remove signing keychain and decoded secrets
        # The ephemeral keychain is deleted here, but the decoded p12, the
        # App Store Connect private key and the provisioning profiles also
        # carry secrets or personal data — do not rely on runner teardown
        # (and self-hosted runners keep their disk).
        if: always()
        run: |
          security delete-keychain vault-ci.keychain || true
          rm -f "$RUNNER_TEMP/vault-dist.p12" "$RUNNER_TEMP/AuthKey.p8" \
            "$RUNNER_TEMP"/*.mobileprovision "$RUNNER_TEMP"/*.provisionprofile \
            "$RUNNER_TEMP"/*.plist
          if [[ -f "$RUNNER_TEMP/installed-profiles" ]]; then
            # Paths contain spaces ("Provisioning Profiles"), so read
            # line-by-line instead of xargs' whitespace splitting.
            while IFS= read -r p; do
              rm -f "$p"
            done < "$RUNNER_TEMP/installed-profiles"
          fi

  publish:
    needs: [linux-packages, android-apk, apple-packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Get version
        id: version
        # Tag builds take the version from the tag; manual (workflow_dispatch)
        # runs fall back to the workspace version — GITHUB_REF would otherwise
        # be "refs/heads/<branch>", whose slashes break the rename below.
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Rename artifacts with version
        # Deb artifacts keep cargo-deb's <pkg>_<ver>-<rel>_amd64.deb names;
        # match by package prefix so each lands on its own target name.
        # The iOS IPA is Ad Hoc signed (installable only on devices
        # registered in the profile) and embeds the team name and registered
        # device UDIDs — never upload it as an artifact or Release asset.
        # Remove any legacy IPA defensively before publishing.
        run: |
          cd dist
          rm -f Vault-iOS.ipa
          for f in *.apk; do mv "$f" "vault-android-v${{ steps.version.outputs.version }}.apk"; done
          for f in edge_*.deb; do mv "$f" "edge-v${{ steps.version.outputs.version }}-amd64.deb"; done
          for f in supernode_*.deb; do mv "$f" "supernode-v${{ steps.version.outputs.version }}-amd64.deb"; done
          mv Vault-macOS.zip "Vault-macOS-v${{ steps.version.outputs.version }}.zip"
          ls -la

      - name: Create GitHub Release
        # Releases need a tag; manual (workflow_dispatch) runs only produce
        # artifacts for verification.
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: Vault ${{ steps.version.outputs.version }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
