name: Apple checks

# PR/push checks: SwiftLint, VaultCore tests, macOS/iOS app regression tests
# and isolated iOS navigation smoke tests. Signed release packaging (iOS IPA +
# notarized macOS zip) runs in release.yml — see docs/releasing.md for the
# required signing secrets.

on:
  workflow_call:
  push:
    branches: [main, develop]
    paths:
      - 'clients/apple/**'
      - 'clients/bridge/**'
      - 'core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/apple.yml'
  pull_request:
    paths:
      - 'clients/apple/**'
      - 'clients/bridge/**'
      - 'core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/apple.yml'
  workflow_dispatch:

jobs:
  swiftlint:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: clients/apple
    steps:
      - uses: actions/checkout@v6

      # Not preinstalled on recent macOS runner images; install via Homebrew.
      # Fails on errors; warnings (e.g. file/type length) are reported but allowed.
      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint

  build:
    runs-on: macos-latest
    env:
      VAULT_CI_DEVICE_TYPE: com.apple.CoreSimulator.SimDeviceType.iPhone-Air
    timeout-minutes: 60
    defaults:
      run:
        working-directory: clients/apple
    steps:
      - uses: actions/checkout@v6

      - name: Identify the default Xcode
        id: xcode
        run: |
          xcodebuild -version
          xcode_build="$(xcodebuild -version | awk '/^Build version / {print $3}')"
          test -n "$xcode_build"
          echo "build=$xcode_build" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios, aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache cargo registry and target dir
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            clients/bridge/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-apple-${{ steps.xcode.outputs.build }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-apple-${{ steps.xcode.outputs.build }}-

      - name: Install protoc (needed by vault-core's prost build script)
        run: brew install protobuf

      - name: Build XCFramework and Swift bindings
        run: VaultCore/Scripts/build-xcframework.sh

      - name: Run VaultCore unit tests
        run: cd VaultCore && swift test

      # Most lifecycle, Quit and provider-IPC regression tests are macOS-only.
      # Running VaultCore or only testing on iOS does not execute them.
      - name: Build and test macOS app (unsigned)
        run: |
          xcodebuild -project Vault.xcodeproj -scheme Vault \
            -destination 'platform=macOS' \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/vault-macos-build" \
            -resultBundlePath "$RUNNER_TEMP/vault-macos-tests.xcresult" \
            -parallel-testing-enabled NO \
            -only-testing:VaultTests \
            CODE_SIGNING_ALLOWED=NO test

      - name: Create and boot an iPhone simulator matching the default Xcode
        id: simulator
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import subprocess

          sdk = subprocess.check_output(
              ["xcrun", "--sdk", "iphonesimulator", "--show-sdk-version"], text=True).strip()
          sdk_version = tuple(map(int, sdk.split(".")[:2]))
          device_type = os.environ["VAULT_CI_DEVICE_TYPE"]
          inventory = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "runtimes", "--json"], text=True))
          candidates = [item for item in inventory["runtimes"]
                        if item["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS-")
                        and item.get("isAvailable")
                        and tuple(map(int, item["version"].split(".")[:2])) == sdk_version]
          if not candidates:
              raise SystemExit(f"No available iOS simulator runtime matches the default Xcode SDK {sdk}")
          runtime = max(candidates, key=lambda item: tuple(map(int, item["version"].split("."))))["identifier"]
          name = f"Vault CI {os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          udid = subprocess.check_output(
              ["xcrun", "simctl", "create", name, device_type, runtime], text=True).strip()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"udid={udid}\n")
          print(f"Using {device_type} / {runtime}: {udid}")
          subprocess.run(["xcrun", "simctl", "boot", udid], check=True)
          subprocess.run(["xcrun", "simctl", "bootstatus", udid, "-b"], check=True)
          PYTHON

      - name: Build and test iOS app (unsigned)
        run: |
          xcodebuild -project Vault.xcodeproj -scheme Vault \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/vault-ios-build" \
            -resultBundlePath "$RUNNER_TEMP/vault-ios-tests.xcresult" \
            -parallel-testing-enabled NO \
            -only-testing:VaultTests \
            CODE_SIGNING_ALLOWED=NO test

      - name: Repeat iOS navigation tests on a fresh simulator (unsigned)
        run: |
          xcodebuild -project Vault.xcodeproj -scheme Vault \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/vault-ios-build" \
            -resultBundlePath "$RUNNER_TEMP/vault-ios-ui-tests.xcresult" \
            -parallel-testing-enabled NO \
            -test-iterations 3 \
            -test-repetition-relaunch-enabled YES \
            -only-testing:VaultUITests/VaultUITests/testStatusPage \
            -only-testing:VaultUITests/VaultUITests/testDiagnosticsAndRuntimeLogs \
            -only-testing:VaultUITests/VaultUITests/testAboutPage \
            CODE_SIGNING_ALLOWED=NO test

      - name: Upload Apple test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: apple-test-results
          path: ${{ runner.temp }}/vault-*-tests.xcresult
          if-no-files-found: warn
          retention-days: 7

      - name: Remove the test simulator
        if: ${{ always() && steps.simulator.outputs.udid != '' }}
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcrun simctl shutdown "$DEVICE_ID" || true
          xcrun simctl delete "$DEVICE_ID"
