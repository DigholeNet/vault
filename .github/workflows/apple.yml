name: Apple checks

# PR/push checks: SwiftLint, VaultCore tests, macOS/iOS app regression tests
# and an iOS navigation smoke test. Signed release packaging (iOS IPA +
# notarized macOS zip) runs in release.yml — see docs/releasing.md for the
# required signing secrets.

on:
  push:
    branches: [main, develop]
    paths:
      - 'clients/apple/**'
      - 'clients/bridge/**'
      - 'core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/apple.yml'
  pull_request:
    paths:
      - 'clients/apple/**'
      - 'clients/bridge/**'
      - 'core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/apple.yml'
  workflow_dispatch:

jobs:
  swiftlint:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: clients/apple
    steps:
      - uses: actions/checkout@v6

      # Not preinstalled on recent macOS runner images; install via Homebrew.
      # Fails on errors; warnings (e.g. file/type length) are reported but allowed.
      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint

  build:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: clients/apple
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios, aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache cargo registry and target dir
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            clients/bridge/target
          key: ${{ runner.os }}-cargo-apple-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-apple-

      - name: Install protoc (needed by vault-core's prost build script)
        run: brew install protobuf

      - name: Build XCFramework and Swift bindings
        run: VaultCore/Scripts/build-xcframework.sh

      - name: Run VaultCore unit tests
        run: cd VaultCore && swift test

      # Most lifecycle, Quit and provider-IPC regression tests are macOS-only.
      # Running VaultCore or only testing on iOS does not execute them.
      - name: Build and test macOS app (unsigned)
        run: |
          xcodebuild -project Vault.xcodeproj -scheme Vault \
            -destination 'platform=macOS' \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/vault-macos-build" \
            -resultBundlePath "$RUNNER_TEMP/vault-macos-tests.xcresult" \
            -parallel-testing-enabled NO \
            -only-testing:VaultTests \
            CODE_SIGNING_ALLOWED=NO test

      - name: Select an available iPhone simulator
        id: simulator
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          inventory = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "--json"], text=True))
          candidates = []
          for runtime, devices in inventory["devices"].items():
              if ".iOS-" not in runtime:
                  continue
              version = tuple(int(part) for part in runtime.split(".iOS-", 1)[1].split("-"))
              if version < (18, 5):
                  continue
              for device in devices:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      candidates.append((version, device["name"], device["udid"]))
          if not candidates:
              raise SystemExit("No available iPhone simulator running iOS 18.5 or later")
          version, name, udid = max(candidates)
          print(f"Using {name} (iOS {'.'.join(map(str, version))}): {udid}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"udid={udid}\n")
          PY

      - name: Build and test iOS app and navigation (unsigned)
        run: |
          xcodebuild -project Vault.xcodeproj -scheme Vault \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/vault-ios-build" \
            -resultBundlePath "$RUNNER_TEMP/vault-ios-tests.xcresult" \
            -parallel-testing-enabled NO \
            -only-testing:VaultTests \
            -only-testing:VaultUITests/VaultUITests/testDiagnosticsAndAboutNavigationWithoutVPN \
            CODE_SIGNING_ALLOWED=NO test

      - name: Upload Apple test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: apple-test-results
          path: ${{ runner.temp }}/vault-*-tests.xcresult
          if-no-files-found: warn
          retention-days: 7
