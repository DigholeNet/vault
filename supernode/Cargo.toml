  ["assets/supernode.target", "/lib/systemd/system/supernode.target", "644"],
  ["target/supernode.1.gz", "/usr/share/man/man1/supernode.1.gz", "644"],
]
depends = "libc6 (>= 2.23), libgcc1 (>= 1:6.0.1)"
