[package]
authors.workspace = true
description = "Vault VPN Linux client"
edition.workspace = true
license.workspace = true
name = "edge"
publish = false
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
anyhow.workspace = true
dashmap = {version = "6"}
pnet = {version = "0.35"}
serde.workspace = true
serde_json = {version = "1"}
toml = {workspace = true}
tracing = {workspace = true}
vault-core = {path = "../../core"}

[package.metadata.deb]
assets = [
  ["../../NOTICE", "/usr/share/doc/edge/NOTICE", "644"],
  ["target/release/edge", "/usr/bin/edge", "755"],
  ["assets/edge.toml.example", "/etc/vault/edge.toml.example", "600"],
  ["assets/edge.service", "/lib/systemd/system/edge.service", "644"],
  ["assets/edge.target", "/lib/systemd/system/edge.target", "644"],
  ["assets/edge-resolved.rules", "/usr/share/polkit-1/rules.d/50-edge.rules", "644"],
  ["target/edge.1.gz", "/usr/share/man/man1/edge.1.gz", "644"],
]
depends = "$auto, iproute2, procps, adduser"
# The resolved backend uses resolvectl and authorizes the vault user via Polkit.
recommends = "systemd-resolved, polkitd"
extended-description = """\
 Vault VPN linux client."""
license-file = ["../../LICENSE", "1"]
maintainer-scripts = "assets/deb-scripts"
section = "net"

# Local musl packages need only runtime command tools; native builds
# retain automatic shared-library dependency detection above.
[package.metadata.deb.variants.musl]
name = "edge"
depends = "iproute2, procps, adduser"

[package.metadata.generate-rpm]
assets = [
  { source = "../../LICENSE", dest = "/usr/share/doc/edge/LICENSE", mode = "644", doc = true },
  { source = "../../NOTICE", dest = "/usr/share/doc/edge/NOTICE", mode = "644", doc = true },
  { source = "target/release/edge", dest = "/usr/bin/edge", mode = "755" },
  { source = "assets/edge.toml.example", dest = "/etc/vault/edge.toml.example", mode = "600" },
  { source = "assets/edge.service", dest = "/usr/lib/systemd/system/edge.service", mode = "644" },
  { source = "assets/edge.target", dest = "/usr/lib/systemd/system/edge.target", mode = "644" },
  { source = "assets/edge-resolved.rules", dest = "/usr/share/polkit-1/rules.d/50-edge.rules", mode = "644" },
  { source = "target/edge.1.gz", dest = "/usr/share/man/man1/edge.1.gz", mode = "644" },
]
post_install_script = "assets/rpm-scripts/postinst"
pre_uninstall_script = "assets/rpm-scripts/prerm"
post_uninstall_script = "assets/rpm-scripts/postrm"

[package.metadata.generate-rpm.requires]
iproute = "*"
procps-ng = "*"
shadow-utils = "*"

[package.metadata.generate-rpm.recommends]
polkit = "*"
systemd-resolved = "*"

[package.metadata.generate-rpm.variants.musl]
auto-req = "no"
